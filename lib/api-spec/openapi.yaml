openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: satcat
    description: Satellite catalog operations
  - name: rpod
    description: RPOD (rendezvous & proximity operations) watch
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /satcat:
    get:
      operationId: getSatcat
      tags: [satcat]
      summary: List satellite catalog entries
      description: Paginated, filterable, sortable list of McDowell GCAT satellite catalog entries
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: search
          in: query
          schema:
            type: string
          description: Text search across name fields
        - name: owner
          in: query
          schema:
            type: string
          description: Filter by owner/country code
        - name: objectClass
          in: query
          schema:
            type: string
          description: "Filter by object class: P (payload), R (rocket body), D (debris), U (unknown)"
        - name: orbit
          in: query
          schema:
            type: string
          description: Filter by operational orbit type (LEO, MEO, GEO, HEO, etc.)
        - name: satState
          in: query
          schema:
            type: string
          description: Filter by satellite state
        - name: gunterType
          in: query
          schema:
            type: string
          description: Filter by Gunter's Space Page "Type / Application" classification
        - name: massMin
          in: query
          schema:
            type: number
          description: Minimum mass in kg (inclusive); entries with unknown mass are excluded
        - name: massMax
          in: query
          schema:
            type: number
          description: Maximum mass in kg (inclusive); entries with unknown mass are excluded
        - name: sort
          in: query
          schema:
            type: string
          description: Field to sort by
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Paginated satellite catalog list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SatcatListResponse"

  /satcat/tle/{norad}:
    get:
      operationId: getSatcatTle
      tags: [satcat]
      summary: Current TLE and orbital elements for a NORAD id
      description: Latest general-perturbations element set from space-track.org, cached server-side
      parameters:
        - name: norad
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Latest element set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TleData"
        "404":
          description: No element set on file for this object
        "502":
          description: space-track.org unavailable

  /satcat/passes:
    get:
      operationId: getSatcatPasses
      tags: [satcat]
      summary: Upcoming passes over an observer location
      description: Predicted passes (SGP4-propagated) for the next N days over the given lat/lon
      parameters:
        - name: norad
          in: query
          required: true
          schema:
            type: integer
        - name: lat
          in: query
          required: true
          schema:
            type: number
          description: Observer latitude in degrees (-90..90)
        - name: lon
          in: query
          required: true
          schema:
            type: number
          description: Observer longitude in degrees (-180..180)
        - name: days
          in: query
          schema:
            type: integer
            default: 3
          description: Days ahead to search (1-7)
      responses:
        "200":
          description: Predicted passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassesResponse"
        "400":
          description: Invalid coordinates
        "404":
          description: No element set on file for this object
        "502":
          description: space-track.org unavailable

  /satcat/stats:
    get:
      operationId: getSatcatStats
      tags: [satcat]
      summary: Mass-to-orbit statistics
      description: Pre-aggregated mass-to-orbit analytics by year, country, orbit type, and launch vehicle
      responses:
        "200":
          description: Aggregated statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SatcatStats"

  /satcat/summary:
    get:
      operationId: getSatcatSummary
      tags: [satcat]
      summary: Satellite catalog summary
      description: Top-level summary counts for hero display
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SatcatSummary"

  /satcat/by-year-provider:
    get:
      operationId: getSatcatByYearProvider
      tags: [satcat]
      summary: Yearly payload mass by provider
      description: Payload mass to orbit per year, split between SpaceX (Falcon family) and the rest of the world
      responses:
        "200":
          description: Yearly provider split
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SatcatByYearProvider"

  /satcat/upmass-by-provider:
    get:
      operationId: getSatcatUpmassByProvider
      tags: [satcat]
      summary: Upmass by provider for a date window
      description: Payload mass delivered to orbit per launch provider within a date window
      parameters:
        - name: start
          in: query
          required: false
          schema:
            type: string
          description: Window start date (YYYY-MM-DD)
        - name: end
          in: query
          required: false
          schema:
            type: string
          description: Window end date (YYYY-MM-DD)
      responses:
        "200":
          description: Provider upmass totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpmassByProvider"

  /satcat/shuttle-audit:
    get:
      operationId: getSatcatShuttleAudit
      tags: [satcat]
      summary: Space Shuttle mass forensics
      description: Splits GCAT Shuttle tonnage into orbiter rows vs deployed cargo, with theorized dry-mass split and Falcon 9 reference
      responses:
        "200":
          description: Shuttle audit breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShuttleAudit"

  /satcat/shuttle-vs-falcon-rate:
    get:
      operationId: getSatcatShuttleVsFalconRate
      tags: [satcat]
      summary: Shuttle vs Falcon 9 launch cadence by program year
      description: Orbital launch attempts per program year (year 1 = first flight year) for Space Shuttle and Falcon 9, with annotated major events
      responses:
        "200":
          description: Program-year-aligned cadence comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShuttleVsFalconRate"

  /satcat/launch-rate:
    get:
      operationId: getSatcatLaunchRate
      tags: [satcat]
      summary: Orbital launch cadence by provider and vehicle
      description: Orbital-class launch attempts per year by provider and vehicle, plus anticipated heavy-lift contender watchlist
      responses:
        "200":
          description: Launch cadence data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchRate"

  /satcat/falcon-vs-starship:
    get:
      operationId: getSatcatFalconVsStarship
      tags: [satcat]
      summary: Falcon vs Starship payload mass by year
      responses:
        "200":
          description: Yearly Falcon vs Starship mass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FalconVsStarship"

  /satcat/spacex-by-site-monthly:
    get:
      operationId: getSatcatSpacexBySiteMonthly
      tags: [satcat]
      summary: SpaceX monthly payload mass by launch site
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: string
          description: Year (YYYY), defaults to current year
      responses:
        "200":
          description: Monthly site breakdown for the year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpacexBySiteMonthly"

  /satcat/spacex-by-site:
    get:
      operationId: getSatcatSpacexBySite
      tags: [satcat]
      summary: SpaceX yearly payload mass by launch site
      responses:
        "200":
          description: Yearly site breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpacexBySite"

  /satcat/spacex-by-entity:
    get:
      operationId: getSatcatSpacexByEntity
      tags: [satcat]
      summary: SpaceX yearly payload mass by customer segment
      responses:
        "200":
          description: Yearly customer-segment breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpacexByEntity"

  /satcat/constellations:
    get:
      operationId: getConstellationAnalytics
      tags: [satcat]
      summary: Constellation analytics
      description: Quarterly active-satellite time series for major constellations, per-constellation shell and variant breakouts, and annual deployment cadence
      responses:
        "200":
          description: Constellation analytics dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstellationAnalytics"

  /satcat/deorbit-history:
    get:
      operationId: getSatcatDeorbitHistory
      tags: [satcat]
      summary: Launch and decay day-numbers for orbital objects
      description: Per-object launch/decay day numbers since 1957-01-01 for deorbit animation; dday of -1 means still in orbit
      responses:
        "200":
          description: Deorbit history dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeorbitHistory"

  /satcat/mass-cdf:
    get:
      operationId: getSatcatMassCdf
      tags: [satcat]
      summary: Cumulative distribution of object masses
      responses:
        "200":
          description: Mass CDF series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MassCdf"

  /satcat/orbital-map:
    get:
      operationId: getSatcatOrbitalMap
      tags: [satcat]
      summary: Perigee vs inclination scatter points
      responses:
        "200":
          description: Orbital map points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrbitalMap"

  /satcat/filters:
    get:
      operationId: getSatcatFilters
      tags: [satcat]
      summary: Available filter values
      description: Returns distinct values for filter dropdowns (owners, orbits, states)
      responses:
        "200":
          description: Available filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SatcatFilters"

  /rpod/events:
    get:
      operationId: getRpodEvents
      tags: [rpod]
      summary: List RPOD events
      description: Flagged rendezvous/proximity events, paginated and sortable; each event carries all involved spacecraft
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: status
          in: query
          schema:
            type: string
            enum: [active, stale, ended]
          description: Filter by event status (ended = coplanar pair drifted apart and stopped passing the screen)
        - name: kind
          in: query
          schema:
            type: string
            enum: [conjunction, coplanar]
          description: Filter by event kind (discrete conjunction vs long-duration coplanar shadowing)
        - name: sort
          in: query
          schema:
            type: string
            enum: [tca, minRangeKm, relVelKmS, memberCount]
          description: Sort field (default tca)
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Paginated RPOD event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpodEventList"

  /rpod/events/{id}:
    get:
      operationId: getRpodEvent
      tags: [rpod]
      summary: RPOD event detail
      description: Event with per-member catalog info and latest element sets for 3D plotting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpodEventDetail"
        "404":
          description: Event not found

  /rpod/status:
    get:
      operationId: getRpodStatus
      tags: [rpod]
      summary: TLE archive and scan status
      description: Archive row counts, backfill cursor position, recent-feed watermark, and last scan result
      responses:
        "200":
          description: Archive/scan status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpodStatus"

components:
  schemas:
    RpodMember:
      type: object
      properties:
        norad:
          type: integer
        name:
          type: string
          nullable: true
        owner:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        objectClass:
          type: string
          nullable: true
        opOrbit:
          type: string
          nullable: true
        ldate:
          type: string
          nullable: true
        minRangeKm:
          type: number
          nullable: true
          description: Tightest pairwise range this member reached vs any other member (km)
        relVelKmS:
          type: number
          nullable: true
      required: [norad]

    RpodTle:
      type: object
      properties:
        line1:
          type: string
        line2:
          type: string
        epoch:
          type: string
        incDeg:
          type: number
        raanDeg:
          type: number
        eccentricity:
          type: number
        argPerigeeDeg:
          type: number
        meanAnomalyDeg:
          type: number
        meanMotionRevPerDay:
          type: number
      required: [line1, line2, epoch, incDeg, raanDeg, eccentricity, argPerigeeDeg, meanAnomalyDeg, meanMotionRevPerDay]

    RpodMemberDetail:
      allOf:
        - $ref: "#/components/schemas/RpodMember"
        - type: object
          properties:
            tle:
              $ref: "#/components/schemas/RpodTle"
              nullable: true

    RpodEvent:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        kind:
          type: string
          description: conjunction (discrete close approach) or coplanar (long-duration co-aligned shadowing)
        windowStart:
          type: string
        windowEnd:
          type: string
        tca:
          type: string
          description: Predicted time of closest approach (ISO)
        minRangeKm:
          type: number
        relVelKmS:
          type: number
        memberCount:
          type: integer
        widenedScan:
          type: boolean
          description: True when the cluster hit the member cap and a widened neighborhood scan ran
        firstDetectedAt:
          type: string
        lastSeenAt:
          type: string
          description: Last scan that re-detected this event
        endedAt:
          type: string
          nullable: true
          description: When the event was retired (pair drifted apart); null while active/stale
        updatedAt:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/RpodMember"
      required: [id, status, kind, windowStart, windowEnd, tca, minRangeKm, relVelKmS, memberCount, widenedScan, firstDetectedAt, lastSeenAt, endedAt, updatedAt, members]

    RpodEventList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RpodEvent"
        total:
          type: integer
        page:
          type: integer
        pages:
          type: integer
      required: [data, total, page, pages]

    RpodEventDetail:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        kind:
          type: string
        windowStart:
          type: string
        windowEnd:
          type: string
        tca:
          type: string
        minRangeKm:
          type: number
        relVelKmS:
          type: number
        memberCount:
          type: integer
        widenedScan:
          type: boolean
        firstDetectedAt:
          type: string
        lastSeenAt:
          type: string
        endedAt:
          type: string
          nullable: true
        updatedAt:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/RpodMemberDetail"
      required: [id, status, kind, windowStart, windowEnd, tca, minRangeKm, relVelKmS, memberCount, widenedScan, firstDetectedAt, lastSeenAt, endedAt, updatedAt, members]

    RpodArchiveStatus:
      type: object
      properties:
        totalRows:
          type: integer
        objects:
          type: integer
        newestEpoch:
          type: string
          nullable: true
        oldestEpoch:
          type: string
          nullable: true
        backfillCursor:
          type: string
          nullable: true
          description: Oldest instant the backward-walking backfill has covered
        recentWatermark:
          type: string
          nullable: true
        backoffUntil:
          type: string
          nullable: true
          description: Set when space-track errors have the workers standing down
      required: [totalRows, objects]

    RpodStatus:
      type: object
      properties:
        archive:
          $ref: "#/components/schemas/RpodArchiveStatus"
        activeEvents:
          type: integer
        lastScanAt:
          type: string
          nullable: true
        lastScanStatus:
          type: string
          nullable: true
        lastScanEvents:
          type: integer
          nullable: true
      required: [archive, activeEvents]

    ConstellationSeries:
      type: object
      properties:
        name:
          type: string
        active:
          type: array
          items:
            type: integer
          description: Active satellites at the end of each quarter (aligned with ConstellationAnalytics.quarters)
      required: [name, active]

    ConstellationSegmentSeries:
      type: object
      properties:
        label:
          type: string
          description: Shell (e.g. "~550 km · 53°") or variant (e.g. "≈800 kg class") label
        active:
          type: array
          items:
            type: integer
      required: [label, active]

    ConstellationTotals:
      type: object
      properties:
        launched:
          type: integer
        active:
          type: integer
        decayed:
          type: integer
        massTonnes:
          type: number
          description: Total launched mass in tonnes (confirmed + estimated)
      required: [launched, active, decayed, massTonnes]

    ConstellationBreakout:
      type: object
      properties:
        name:
          type: string
        totals:
          $ref: "#/components/schemas/ConstellationTotals"
        shells:
          type: array
          items:
            $ref: "#/components/schemas/ConstellationSegmentSeries"
          description: Active satellites per orbital shell over time
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ConstellationSegmentSeries"
          description: Active satellites per hardware variant (mass class) over time
      required: [name, totals, shells, variants]

    ConstellationCadenceSeries:
      type: object
      properties:
        name:
          type: string
        counts:
          type: array
          items:
            type: integer
          description: Satellites launched per year (aligned with ConstellationAnalytics.launchYears)
      required: [name, counts]

    ConstellationAnalytics:
      type: object
      properties:
        quarters:
          type: array
          items:
            type: string
          description: Shared quarterly time axis, e.g. "2019-Q1"; the final entry is "NOW" (current in-progress quarter, counted as of request time)
        overall:
          type: array
          items:
            $ref: "#/components/schemas/ConstellationSeries"
          description: Active satellites per constellation per quarter, largest first
        launchYears:
          type: array
          items:
            type: integer
        launchedPerYear:
          type: array
          items:
            $ref: "#/components/schemas/ConstellationCadenceSeries"
        breakouts:
          type: array
          items:
            $ref: "#/components/schemas/ConstellationBreakout"
          description: Shell/variant breakouts for the biggest constellations
      required: [quarters, overall, launchYears, launchedPerYear, breakouts]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SatcatEntry:
      type: object
      properties:
        jcat:
          type: string
          description: Jonathan's catalog number
        satno:
          type: ["integer", "null"]
          description: US Space Command catalog number
        name:
          type: string
          description: Object name
        plName:
          type: ["string", "null"]
          description: Payload name
        ldate:
          type: ["string", "null"]
          description: Launch date (YYYY-MM-DD)
        lv:
          type: ["string", "null"]
          description: Launch vehicle
        lvFamily:
          type: ["string", "null"]
          description: Launch vehicle family
        site:
          type: ["string", "null"]
          description: Launch site code
        owner:
          type: ["string", "null"]
          description: Owner country or organization
        state:
          type: ["string", "null"]
          description: Country/state code
        objectClass:
          type: ["string", "null"]
          description: "Object class: P=payload, R=rocket body, D=debris, U=unknown"
        objType:
          type: ["string", "null"]
          description: More specific object type
        opOrbit:
          type: ["string", "null"]
          description: Operational orbit type (LEO, MEO, GEO, HEO, etc.)
        satState:
          type: ["string", "null"]
          description: Satellite state (Operational, Dead, Reentry, etc.)
        massKg:
          type: ["number", "null"]
          description: Dry mass in kilograms
        massEstimated:
          type: boolean
          description: True when massKg is a Bureau estimate rather than GCAT-catalogued data
        apogeeKm:
          type: ["number", "null"]
          description: Apogee altitude in km
        perigeeKm:
          type: ["number", "null"]
          description: Perigee altitude in km
        incDeg:
          type: ["number", "null"]
          description: Orbital inclination in degrees
        periodMin:
          type: ["number", "null"]
          description: Orbital period in minutes
        decayDate:
          type: ["string", "null"]
          description: Decay or reentry date
        gunterType:
          type: ["string", "null"]
          description: Gunter's Space Page "Type / Application" classification
        gunterNation:
          type: ["string", "null"]
          description: Gunter's Space Page "Nation" fact
        gunterOperator:
          type: ["string", "null"]
          description: Gunter's Space Page "Operator" fact
        gunterContractors:
          type: ["string", "null"]
          description: Gunter's Space Page "Contractors" fact
        gunterUrl:
          type: ["string", "null"]
          description: Cross-link to the full dossier on space.skyrocket.de
        gunterTitle:
          type: ["string", "null"]
          description: Dossier page title, for Krebs-format citations
        gunterRetrievedAt:
          type: ["string", "null"]
          description: ISO timestamp the dossier was retrieved
      required:
        - jcat
        - name

    TleData:
      type: object
      properties:
        norad:
          type: integer
        name:
          type: ["string", "null"]
        line1:
          type: string
        line2:
          type: string
        epoch:
          type: string
          description: Element-set epoch (ISO 8601)
        incDeg:
          type: number
        raanDeg:
          type: number
          description: Right ascension of the ascending node, degrees
        argPerigeeDeg:
          type: number
          description: Argument of perigee, degrees
        meanAnomalyDeg:
          type: number
        eccentricity:
          type: number
        meanMotionRevPerDay:
          type: number
        fetchedAt:
          type: string
          description: When this element set was fetched from space-track (ISO 8601)
      required:
        - norad
        - line1
        - line2
        - epoch
        - incDeg
        - raanDeg
        - argPerigeeDeg
        - meanAnomalyDeg
        - eccentricity
        - meanMotionRevPerDay
        - fetchedAt

    SatPass:
      type: object
      properties:
        startTime:
          type: string
          description: Pass start (rises above 0° elevation), ISO 8601
        maxTime:
          type: string
          description: Time of maximum elevation, ISO 8601
        endTime:
          type: string
          description: Pass end (drops below 0° elevation), ISO 8601
        maxElevationDeg:
          type: number
        startAzDeg:
          type: number
        maxAzDeg:
          type: number
        endAzDeg:
          type: number
        visible:
          type: boolean
          description: True when the satellite is sunlit while the observer sky is dark during the pass
      required:
        - startTime
        - maxTime
        - endTime
        - maxElevationDeg
        - startAzDeg
        - maxAzDeg
        - endAzDeg
        - visible

    PassesResponse:
      type: object
      properties:
        norad:
          type: integer
        lat:
          type: number
        lon:
          type: number
        days:
          type: integer
        epoch:
          type: string
          description: Element-set epoch used for propagation (ISO 8601)
        passes:
          type: array
          items:
            $ref: "#/components/schemas/SatPass"
      required:
        - norad
        - lat
        - lon
        - days
        - epoch
        - passes

    SatcatListResponse:
